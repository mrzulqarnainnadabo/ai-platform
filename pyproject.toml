[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform"
version = "0.1.0"
description = "Provider-neutral AI platform substrate"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["ai_platform*"]
exclude = ["api*", "supabase*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
