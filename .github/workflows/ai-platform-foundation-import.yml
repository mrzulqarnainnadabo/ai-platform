name: AI Platform Foundation Import

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Import or refresh the awesome-llm-apps foundation"
        required: true
        default: "import"
        type: choice
        options:
          - import
          - refresh
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: foundation-import
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/Shubhamsaboo/awesome-llm-apps.git
  SYNC_BRANCH: automation/foundation-sync

jobs:
  sync-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "ai-platform-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare sync branch
        run: |
          git fetch origin main
          git checkout -B "$SYNC_BRANCH" origin/main

      - name: Fetch upstream foundation
        run: |
          rm -rf /tmp/awesome-llm-apps
          git clone --depth 1 "$UPSTREAM_REPO" /tmp/awesome-llm-apps

      - name: Import upstream files without replacing platform controls
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='README.md' \
            --exclude='UPSTREAM_FOUNDATION.md' \
            --exclude='PLATFORM_ARCHITECTURE.md' \
            --exclude='PLATFORM_GOVERNANCE.md' \
            --exclude='PLATFORM_STRATEGY.md' \
            --exclude='AGENTS.md' \
            --exclude='JULES_PHASE_1_IMPORT_AUDIT.md' \
            --exclude='docs/ROADMAP.md' \
            --exclude='docs/audit/' \
            /tmp/awesome-llm-apps/ ./

      - name: Record upstream provenance
        run: |
          cat > UPSTREAM_FOUNDATION.md <<'EOF'
          # Upstream Foundation

          This repository incorporates material from:

          - Source: https://github.com/Shubhamsaboo/awesome-llm-apps
          - License: Apache License 2.0

          The imported source is a foundation for the AI Platform and is not represented as original authorship by this project. Preserve applicable copyright, license, NOTICE, and attribution requirements when modifying or redistributing upstream material.

          Platform-specific architecture, code, documentation, and modifications added by `mrzulqarnainnadabo/ai-platform` are maintained separately from the upstream project's authorship.
          EOF

      - name: Commit sync branch
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes to import."
            exit 0
          fi
          git commit -m "chore: sync awesome-llm-apps foundation"
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Open or update review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "chore: sync upstream AI foundation" \
            --body "Automated upstream synchronization from Shubhamsaboo/awesome-llm-apps. Review licensing, dependency, security, and compatibility impact before merging." \
            2>/dev/null || true
