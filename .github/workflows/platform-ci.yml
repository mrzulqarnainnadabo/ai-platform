name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package, host dependency, and test tooling
        run: python -m pip install --upgrade pip pytest && python -m pip install -e . && python -m pip install -r requirements.txt
      - name: Repository sanity
        run: |
          test -f README.md
          test -f UPSTREAM_FOUNDATION.md
          test -f PLATFORM_ARCHITECTURE.md
          test -f PLATFORM_GOVERNANCE.md
          test -f AGENTS.md
          test -f docs/ROADMAP.md
      - name: Import and compile checks
        run: python -m compileall -q ai_platform api
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!docs/audit/*'; then
            echo "Potential credential pattern detected. Review before merging."
            exit 1
          fi
