name: Automated Delivery & Governance Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - 'jules/**'
      - 'grok/**'
      - 'automation/**'
      - 'dependabot/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr-creation:
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Pull Request if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH."
          else
            echo "Creating automated PR for branch $BRANCH..."
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "auto: delivery pipeline update for $BRANCH" \
              --body "Automated pull request generated for agent branch \`$BRANCH\`."
          fi

  classify-and-deliver:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify Changed Files & Policy Risk
        id: classify
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Comparing $BASE_REF...$HEAD_REF"

          HIGH_RISK=false
          UNCLASSIFIED=false
          GATED_REASONS=""

          # Safely iterate through null-delimited file diffs
          while IFS= read -r -d '' file; do
            [ -z "$file" ] && continue

            case "$file" in
              .github/workflows/*)
                HIGH_RISK=true
                GATED_REASONS="${GATED_REASONS}\n- Workflow definition modified: \`$file\`"
                ;;
              PLATFORM_GOVERNANCE.md)
                HIGH_RISK=true
                GATED_REASONS="${GATED_REASONS}\n- Governance policy modified: \`$file\`"
                ;;
              PLATFORM_ARCHITECTURE.md)
                HIGH_RISK=true
                GATED_REASONS="${GATED_REASONS}\n- Platform architecture modified: \`$file\`"
                ;;
              PLATFORM_STRATEGY.md)
                HIGH_RISK=true
                GATED_REASONS="${GATED_REASONS}\n- Platform strategy modified: \`$file\`"
                ;;
              AGENTS.md)
                HIGH_RISK=true
                GATED_REASONS="${GATED_REASONS}\n- Agent authority rules modified: \`$file\`"
                ;;
              docs/audit/*)
                HIGH_RISK=true
                GATED_REASONS="${GATED_REASONS}\n- Platform audit deliverable modified: \`$file\`"
                ;;
              platform/core/*|platform/policies/*|platform/security/*)
                HIGH_RISK=true
                GATED_REASONS="${GATED_REASONS}\n- Core platform security/kernel modified: \`$file\`"
                ;;
              README.md|UPSTREAM_FOUNDATION.md|JULES_PHASE_1_IMPORT_AUDIT.md|docs/ROADMAP.md|LICENSE|.gitignore|.gitattributes)
                # Explicit safe documentation and repo metadata
                ;;
              docs/*)
                # Documentation updates outside docs/audit/
                ;;
              *test*|tests/*|*_test.py|test_*.py|*.spec.ts|*.test.ts)
                # Explicit test updates
                ;;
              foundation/examples/*)
                # Explicit isolated foundation reference examples
                ;;
              *)
                # Unclassified / non-whitelisted path -> Default DENY
                UNCLASSIFIED=true
                GATED_REASONS="${GATED_REASONS}\n- Unclassified / non-whitelisted path modified: \`$file\`"
                ;;
            esac
          done < <(git diff -z --name-only "$BASE_REF" "$HEAD_REF")

          if [ "$HIGH_RISK" = "true" ] || [ "$UNCLASSIFIED" = "true" ]; then
            echo "risk=HIGH_RISK" >> "$GITHUB_OUTPUT"
            echo "reasons<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$GATED_REASONS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "risk=SAFE_AUTOMERGE" >> "$GITHUB_OUTPUT"
            echo "reasons=Explicitly whitelisted safe changes (documentation, tests, isolated examples)." >> "$GITHUB_OUTPUT"
          fi

      - name: Handle High-Risk Gated PR
        if: steps.classify.outputs.risk == 'HIGH_RISK'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASONS: ${{ steps.classify.outputs.reasons }}
        run: |
          echo "PR #$PR_NUMBER is classified as HIGH-RISK / UNCLASSIFIED. Auto-merge disabled."
          COMMENT_BODY="### 🛑 Automated Delivery Gate: Architectural Review Required

This PR contains changes that alter platform security, governance, workflows, kernel contracts, or unclassified paths:
$REASONS

**Action Required:** Auto-merge is disabled for this PR. High-risk changes require designated architectural/security review before merge."

          gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY" || true

      - name: Enable Auto-Merge for Safe PR
        if: steps.classify.outputs.risk == 'SAFE_AUTOMERGE'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "PR #$PR_NUMBER is classified as SAFE. Enabling auto-merge..."
          if gh pr merge "$PR_NUMBER" --auto --squash; then
            echo "Auto-merge enabled for PR #$PR_NUMBER. Will merge automatically when required CI passes."
          else
            echo "Notice: Auto-merge API call failed or 'Allow auto-merge' is not enabled in GitHub repository settings."
          fi
